{% extends 'main/base.html' %}

{% block title %}Reset password | Writing Feedback Portal{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <span class="view-eyebrow">Account</span>
    <h1 class="heading">Reset your password.</h1>
    <p class="subheading">Enter the email address associated with your account. We’ll send a link to reset your password.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="field">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" required autofocus>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary">Send reset link</button>
        <a class="quiet-link" href="{% url 'login' %}">Back to login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
